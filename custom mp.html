<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
  :root {
  --primary-color: #1D285C;
  --secondary-color: #5DC5E3;
  --tertiory-color: rgb(8, 8, 10);
  --white-color: rgb(255, 255, 255);
  --paragraph-color: #404650;
  --subheading-color: #0B162C;
  --base-line-height: 1.4;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:var(--white-color);
  color:var(--paragraph-color);
}

.amenities-img{
  padding:90px 20px;
}

.container{
  max-width:1200px;
  margin:auto;
}

/* Heading */
.section-title{
  text-align:center;
  font-family:'Playfair Display',serif;
  font-size:3rem;
  color:var(--primary-color);
}

.section-subtitle{
  text-align:center;
  max-width:700px;
  margin:15px auto 60px;
  color:var(--paragraph-color);
}

/* Cards */
.amenities-cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:30px;
}

.amenity-img-card{
  position:relative;
  height:450px;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  transition:.4s ease;
}

.amenity-img-card:hover{
  transform:translateY(-10px);
  box-shadow:0 20px 40px rgba(0,0,0,.15);
}

.amenity-img-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.6s ease;
}

.amenity-img-card:hover img{
  transform:scale(1.08);
}

/* Icon */
.amenity-icon{
  position:absolute;
  top:20px;
  right:20px;
  width:55px;
  height:55px;
  background:var(--secondary-color);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--white-color);
  font-size:22px;
}

/* Overlay */
.amenity-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.2));
  padding:35px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  transition:.4s ease;
}

.amenity-overlay h3{
  font-size:26px;
  color:var(--white-color);
}

.amenity-overlay p{
  margin-top:10px;
  font-size:15px;
  color:var(--white-color);
  opacity:0;
  transform:translateY(15px);
  transition:.4s ease;
}

.amenity-img-card:hover p{
  opacity:1;
  transform:translateY(0);
}


/* Responsive */
@media(max-width:992px){
  .amenities-cards{grid-template-columns:repeat(2,1fr);}
}

@media(max-width:575px){
  .amenities-cards{grid-template-columns:1fr;}
  .section-title{font-size:2.2rem;}
}
</style>
</head>
